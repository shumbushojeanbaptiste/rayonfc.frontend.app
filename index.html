<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="" href="/rayonblue.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rayonsport TV</title>

    <!-- 🔒 Lock dark mode + ⚡ prevent white flash -->
    <script>
      (function () {
        try {
          document.documentElement.classList.add('light');
          localStorage.setItem('color-theme', 'light');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
